name: Deploy Tutorial Dashboard to GitHub Pages

# Builds the Next.js app in youtube-tutorial-dashboard/ as a static site and
# publishes it to GitHub Pages. Runs on pushes to the dashboard branch and can
# be triggered manually from the Actions tab.
on:
  push:
    branches:
      - claude/youtube-tutorial-dashboard-m6edoa
    paths:
      - "youtube-tutorial-dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Permissions required for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-tutorial-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-tutorial-dashboard/package-lock.json

      # enablement: true turns Pages on via the API so no manual toggle is
      # needed (requires the pages: write permission above).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: youtube-tutorial-dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
